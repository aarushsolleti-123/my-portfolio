
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Basketball Hub</title>

  <style>
    body {
      background-color: #0b1220;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .scores-section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
      background: #111c33;
      border: 1px solid #243653;
      border-radius: 16px;
    }

    .scores-section h2 {
      color: #22d3ee;
    }

    .scores-subtitle,
    .scores-message {
      color: #b8c4d9;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .score-card {
      background: #0b1220;
      border: 1px solid #29415e;
      border-radius: 12px;
      padding: 18px;
    }

    .score-card h3 {
      color: white;
    }

    .score-number {
      color: #22d3ee;
      font-size: 24px;
      font-weight: bold;
    }

    .score-status {
      color: #aabbd2;
    }

    .scores-link {
      color: #22d3ee;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<section class="scores-section">
  
<section class="scores-section">
  <div class="scores-header">
    <div>
      <p class="eyebrow">NBA • LIVE CENTER</p>
      <h2>Today's Games 🏀</h2>
      <p id="last-updated">Waiting for scores...</p>
    </div>
    <button id="refresh-scores" type="button">
      ↻ Refresh
    </button>
  </div>

  <div id="scores-status" role="status">
    Loading NBA scores...
  </div>

  <div id="scores-container" class="scores-grid"></div>

  <p class="scores-note">
    Scores are provided by an external data feed and may be delayed.
  </p>
</section>

</section>

<script>
const SCOREBOARD_URL =
  "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json";

const scoresContainer = document.getElementById("scores-container");
const scoresStatus = document.getElementById("scores-status");
const lastUpdated = document.getElementById("last-updated");
const refreshButton = document.getElementById("refresh-scores");

let isLoading = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getGameStatus(game) {
  const status = Number(game.gameStatus);
  const statusText = game.gameStatusText || "";

  if (status === 3) return "Final";
  if (status === 1) return statusText || "Scheduled";

  const clock = game.gameClock || "";
  const period = Number(game.period) || 0;

  if (period > 4) {
    return `OT${period > 5 ? period - 4 : ""} ${clock}`.trim();
  }

  if (period > 0) {
    return `${period === 1 ? "Q1" : period === 2 ? "Q2" : period === 3 ? "Q3" : "Q4"} ${clock}`.trim();
  }

  return statusText || "Live";
}

function renderGames(games) {
  if (!games.length) {
    scoresContainer.innerHTML = "";
    scoresStatus.textContent = "No NBA games scheduled for today.";
    return;
  }

  scoresStatus.textContent = "";

  scoresContainer.innerHTML = games.map(game => {
    const home = game.homeTeam || {};
    const away = game.awayTeam || {};
    const status = getGameStatus(game);

    const homeName = `${home.teamCity || ""} ${home.teamName || home.teamTricode || "Home"}`.trim();
    const awayName = `${away.teamCity || ""} ${away.teamName || away.teamTricode || "Away"}`.trim();

    const showScores = Number(game.gameStatus) !== 1;

    return `
      <article class="score-card">
        <div class="game-status">${escapeHTML(status)}</div>
        <div class="team-row">
          <span class="team-name">${escapeHTML(awayName)}</span>
          <span class="team-score">${showScores ? escapeHTML(away.score ?? 0) : "—"}</span>
        </div>
        <div class="team-row">
          <span class="team-name">${escapeHTML(homeName)}</span>
          <span class="team-score">${showScores ? escapeHTML(home.score ?? 0) : "—"}</span>
        </div>
      </article>
    `;
  }).join("");
}

async function loadScores() {
  if (isLoading) return;
  isLoading = true;
  refreshButton.disabled = true;
  scoresStatus.textContent = "Loading NBA scores...";

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const response = await fetch(SCOREBOARD_URL, {
      cache: "no-store",
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error(`Request failed (${response.status})`);
    }

    const data = await response.json();
    const games = data.scoreboard?.games;

    if (!Array.isArray(games)) {
      throw new Error("Unexpected scoreboard data");
    }

    renderGames(games);
    lastUpdated.textContent =
      "Last checked: " + new Date().toLocaleTimeString();

  } catch (error) {
    scoresStatus.textContent = error.name === "AbortError"
      ? "The request took too long. Please try again."
      : "Couldn't load NBA scores. Check your connection and try again.";

    console.error("NBA scoreboard error:", error);

  } finally {
    clearTimeout(timeout);
    isLoading = false;
    refreshButton.disabled = false;
  }
}

refreshButton.addEventListener("click", loadScores);

loadScores();
setInterval(loadScores, 30000);
</script>
</body>>
</html>
